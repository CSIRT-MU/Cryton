[project]
name = "cryton"
version = "3.1.1"
description = "Advanced scenario orchestrator"
authors = [
    {name = "Ivo Nutár", email = "nutar@ics.muni.cz"},
    {name = "Milan Boháček", email = "bohacek@ics.muni.cz"},
    {name = "Jiří Rája", email = "raja@ics.muni.cz"},
    {name = "Andrej Tomči", email = "tomci@ics.muni.cz"},
]
maintainers = [
    {name = "Jiří Rája", email = "raja@ics.muni.cz"},
]
readme = "README.md"
license = { text = "MIT" }
homepage = "https://gitlab.ics.muni.cz/cryton"
repository = "https://gitlab.ics.muni.cz/cryton/cryton"
documentation = "https://cryton.gitlab-pages.ics.muni.cz/"
"Bug Tracker" = "https://github.com/CSIRT-MU/Cryton/issues"
keywords = [
    "cryton", "hive", "advanced", "scheduler", "cli", "client", "orchestrator", "attacker", "cron", "job", "worker"
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "click>=8.1.3",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
hive = [
    "APScheduler>=3.10.4",
    "Django>=4.0.1,<5.0",
    "django-cors-headers>=4.3.0",
    "djangorestframework>=3.14.0",
    "drf-spectacular>=0.27.0",
    "Jinja2>=3.0.3",
    "psycopg2-binary>=2.9.5",
    "structlog>=24.1.0",
    "pytz>=2024.1",
    "AMQPStorm>=2.10.4",
    "uuid>=1.30",
    "SQLAlchemy>=2.0.23",
    "gunicorn>=23.0.0",
    "uvicorn>=0.32.0",
    "jsonschema>=4.22.0",
    "snek-sploit>=0.8.3",
]
modules = [
    "python3-nmap>=1.6.0",
    "utinni-fork>=0.5.1",
]
worker = [
    "snek-sploit>=0.8.3",
    "AMQPStorm>=2.10.4",
    "structlog>=24.1.0",
    "bottle>=0.13.1",
    "pyfiglet>=1.0.2",
    "requests>=2.28.2",
    "jsonschema>=4.22.0",
    # module dependencies
    "python3-nmap>=1.6.0",
    "utinni-fork>=0.5.1",
]
cli = [
    "requests>=2.28.2",
    "tzlocal>=5.2",
    "pytz>=2024.1",
]

[project.scripts]
cryton-hive = 'cryton.hive.entrypoint:cli'
cryton-worker = 'cryton.worker.entrypoint:cli'
cryton-cli = 'cryton.cli.entrypoint:cli'

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.3",
    "pytest-django>=4.7.0",
    "model-bakery>=1.4.0",
    "tox>=4.4.4",
    "tox-uv-bare>=1.13",
    "drf-spectacular-sidecar>=2025.2.0",
]

docs = [
    "mkdocs>=1.3.1",
    "mkdocs-material>=9.0.0",
    "mike>=2.0.0",
    "mkdocs-macros-plugin>=1.0.0",
    "mkdocs-include-markdown-plugin>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["FIX"]
ignore = ["F", "FIX002"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
console_output_style = "progress"
testpaths = ['tests']
pythonpath = ['.']
addopts = "-ra -q"
